<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CubeRank</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
  <h1>Cubify ⏱️</h1>
 <button id="btnPerfil">👤 Perfil</button>

  <div class="stats">
    <p><strong>Best:</strong> <span id="best">-</span></p>
    <p><strong>Avg 5:</strong> <span id="avg5">-</span></p>
    <p><strong>Média:</strong> <span id="media">-</span></p>
    <p><strong>Solves:</strong> <span id="total">0</span></p>
  </div>
  
<h3>Ranking Global</h3>
<ul id="ranking"></ul>



  <h3>Tempos</h3>
  <ul id="listaTempos"></ul>
</div>

  <!-- CONTEÚDO CENTRAL -->
  <div class="content">

    <div class="topo">
      <span id="scramble">Scramble aqui</span>
    </div>
    

    <div id="timer">0.00</div>

    <div class="botoes">
        <button onclick="reset()">Reset</button>
        <button onclick="novoScramble()">🔀 Embaralhar</button>
      </div>

    <div id="cubo"></div>

  </div>

</div>
