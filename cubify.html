<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubify</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h1>Cubify ⏱️</h1>

    <div class="stats">
      <p><strong>Best:</strong> <span id="best">-</span></p>
      <p><strong>Média:</strong> <span id="media">-</span></p>
      <p><strong>Solves:</strong> <span id="total">0</span></p>
    </div>

    <h3>Ranking</h3>
    <ul id="ranking"></ul>

    <h3>Salas</h3>
    <p id="statusSala">❌ Fora de sala</p>
    <button id="btnCriarSala">Criar Sala</button>
    <input id="roomInput" placeholder="Código da sala">
    <button id="btnEntrarSala">Entrar</button>
    <button id="btnCopiarSala">Copiar Código</button>
<button id="btnSairSala">Sair da Sala</button>
<p id="statusSala"></p>

  </div>

  <!-- CONTEÚDO -->
  <div class="content">

    <div id="scramble">Scramble...</div>

    <div id="areaTimer" class="duel">

  <div class="playerBox">
    <p>Você</p>
    <div id="timer">0.00</div>
  </div>

  <div class="playerBox">
    <p>Oponente</p>
    <div id="timerOponente">0.00</div>
  </div>

</div>

<p id="statusSala"></p>
    
    <div id="cubo"></div>

  </div>

</div>
